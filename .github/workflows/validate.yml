name: Validate skills

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill folders, frontmatter, links and manifests
        run: python3 scripts/validate-skills.py

      - name: Syntax-check shell scripts
        run: |
          find scripts skills -name '*.sh' -print0 | xargs -0 -n1 bash -n
